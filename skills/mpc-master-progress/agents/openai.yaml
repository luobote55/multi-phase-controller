interface:
  display_name: "MPC Master Progress"
  short_description: "Read MPC task status without writing / 只读查看 MPC 任务状态"
  default_prompt: "Resolve the shared controller directory as `~/.mpc/{git-repo-name}/`, read controller files in read-only mode, and show either the full task overview or one task's detailed status, always followed by the latest task tree across the active and archive files. 以 Git 仓库名解析共享控制目录 `~/.mpc/{工程项目名}/`，只读读取控制文件，展示全部任务总览，或查询单个任务在活动区与归档区中的详细状态，并且始终在结尾输出最新任务树。"
