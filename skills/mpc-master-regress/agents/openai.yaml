interface:
  display_name: "MPC Master Regress"
  short_description: "Optionally regress one completed task / 对单个已完成任务做可选回归确认"
  default_prompt: "Resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the controller directory, read one completed MPC task from `<repo-root>/.mpc/mpc.md`, treat it as output produced while using GSD skills, evaluate whether it satisfies the subtask goal using the completion summary, self-check results, and current repository state, present a regression recommendation together with the current full task tree, and only update it to `已回归` after explicit approval. 先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为控制目录；从 `<repo-root>/.mpc/mpc.md` 读取一个处于 `完成` 状态的任务，并将其理解为利用 GSD skills 推进后的产出；基于完成摘要、自检结果和当前总代码状态围绕 `子任务目标` 形成回归建议与任务树展示；只有在调用者明确确认后才把状态更新为 `已回归`。"
