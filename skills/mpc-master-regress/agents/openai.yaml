interface:
  display_name: "MPC Master Regress"
  short_description: "Review a completed MPC task / 对已完成的 MPC 子任务执行主控回归"
  default_prompt: "Resolve the shared controller directory as `~/.mpc/{git-repo-name}/`, read one MPC subtask in the `完成` state from `~/.mpc/{git-repo-name}/mpc.md`, evaluate whether it satisfies the subtask goal, present a regression recommendation together with the current full task tree, and only update it to `已回归` after explicit approval; after any conclusion, show the refreshed full task tree again. 以 Git 仓库名解析共享控制目录 `~/.mpc/{工程项目名}/`，从 `~/.mpc/{工程项目名}/mpc.md` 读取一个处于 `完成` 状态的 MPC 子任务，围绕 `子任务目标` 形成回归证据与回归建议，并先展示当前完整任务树；在调用者确认通过后再把状态更新为 `已回归`，随后再次输出刷新后的完整任务树。"
