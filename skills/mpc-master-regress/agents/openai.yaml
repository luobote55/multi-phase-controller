interface:
  display_name: "MPC Master Regress"
  short_description: "Review a completed MPC task / 对已完成的 MPC 子任务执行主控回归"
  default_prompt: "Resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the controller directory, read one MPC subtask in the `完成` state from `<repo-root>/.mpc/mpc.md`, evaluate whether it satisfies the subtask goal using the completion summary, self-check results, and current repository state, present a regression recommendation together with the current full task tree, and only update it to `已回归` after explicit approval; after any conclusion, show the refreshed full task tree again. 先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为控制目录；从 `<repo-root>/.mpc/mpc.md` 读取一个处于 `完成` 状态的 MPC 子任务，基于完成摘要、自检结果和当前总代码状态围绕 `子任务目标` 形成回归证据与回归建议，并先展示当前完整任务树；在调用者确认通过后再把状态更新为 `已回归`，随后再次输出刷新后的完整任务树。"
