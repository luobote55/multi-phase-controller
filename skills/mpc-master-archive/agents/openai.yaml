interface:
  display_name: "MPC Master Archive"
  short_description: "Archive a regressed MPC task / 归档已回归的 MPC 子任务"
  default_prompt: "Read one MPC subtask in the `已回归` state, move it from `.mpc/mpc.md` to `.mpc/mpc-archive.md`, and update both archive fields and file metadata. 读取一个状态为 `已回归` 的 MPC 子任务，将其从 `.mpc/mpc.md` 移动到 `.mpc/mpc-archive.md`，并同步更新归档字段与文件头部元信息。"
