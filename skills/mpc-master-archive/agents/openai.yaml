interface:
  display_name: "MPC Master Archive"
  short_description: "Archive a regressed MPC task / 归档已回归的 MPC 子任务"
  default_prompt: "Resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the controller directory, read one MPC subtask in the `已回归` state from the current repository's shared multi-conversation board, move it from `<repo-root>/.mpc/mpc.md` to `<repo-root>/.mpc/mpc_archive.md`, update both archive fields and file metadata, and then render the refreshed full task tree with the archived node still visible as `[已归档]`. 先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为控制目录；从当前仓库的共享多对话任务板中读取一个状态为 `已回归` 的 MPC 子任务，将其从 `<repo-root>/.mpc/mpc.md` 移动到 `<repo-root>/.mpc/mpc_archive.md`，同步更新归档字段与文件头部元信息，并在结尾输出刷新后的完整任务树，且保留目标节点并显示为 `[已归档]`。"
