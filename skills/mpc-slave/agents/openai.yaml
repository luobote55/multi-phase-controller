interface:
  display_name: "MPC Slave"
  short_description: "Advance one explicit MPC task / 按显式任务名推进单个 MPC 任务"
  default_prompt: "Resolve the shared controller directory as `~/.mpc/{git-repo-name}/`, require an explicit task name argument, update that task inside `~/.mpc/{git-repo-name}/mpc.md`, and when the evidence is ready, judge completion against the subtask goal and show a full decision task tree with direct `[决策]` / `[推荐]` markers before moving it to `完成` after explicit approval. 以 Git 仓库名解析共享控制目录 `~/.mpc/{工程项目名}/`，要求显式传入任务名参数，更新 `~/.mpc/{工程项目名}/mpc.md` 中该任务的进度；当证据充分时，基于 `子任务目标` 判断是否建议完成，并先输出带直接 `[决策]` / `[推荐]` 标记的完整任务树，得到确认后再推进到 `完成`。"
