interface:
  display_name: "MPC Slave"
  short_description: "Advance one recorded MPC task / 推进单个已记录的 MPC 任务"
  default_prompt: "Resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the controller directory, require an explicit task name argument, update that recorded task inside `<repo-root>/.mpc/mpc.md`, and whenever you set or refresh `下一步提示词`, preserve the `利用gsd skills的能力，实现需求：...` prefix. When the evidence is ready, judge completion against the subtask goal and show the completion evidence before moving the task to `完成` after explicit approval. 先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为控制目录；要求显式传入任务名参数，更新 `<repo-root>/.mpc/mpc.md` 中该已记录任务的进度；每当设置或刷新 `下一步提示词` 时，都必须保留 `利用gsd skills的能力，实现需求：...` 前缀；当证据充分时，基于 `子任务目标` 判断是否建议完成，并在得到确认后再推进到 `完成`。"
