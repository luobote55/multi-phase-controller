interface:
  display_name: "MPC Master Start"
  short_description: "Import GSD tasks into MPC / 将 GSD 任务导入 MPC 记录板"
  default_prompt: "Read a GSD plan document or already split task list, resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the shared controller directory, import and normalize those tasks into `<repo-root>/.mpc/mpc.md`, preserve source order and granularity when the source is already executable, only do light splitting when needed, generate `开始提示词` with the `利用gsd skills的能力，实现需求：...` prefix, and print output in this order: `本次新增任务清单`, `最新任务树`, `首轮可执行任务与 /mpc-slave 命令`. 读取 GSD 计划文档或已经拆分好的任务列表，先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为共享控制目录；将任务整理并规范化写入 `<repo-root>/.mpc/mpc.md`，当源条目已经可执行时尽量保留其顺序与粒度，仅在必要时做轻量拆分；生成的 `开始提示词` 必须包含 `利用gsd skills的能力，实现需求：...` 前缀；最终按 `本次新增任务清单`、`最新任务树`、`首轮可执行任务与 /mpc-slave 命令` 的顺序输出结果。"
