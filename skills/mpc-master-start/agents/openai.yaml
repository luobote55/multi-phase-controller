interface:
  display_name: "MPC Master Start"
  short_description: "Create MPC subtasks from a plan file / 从计划文件创建 MPC 子任务"
  default_prompt: "Read a requirement or plan document, resolve the shared controller directory as `~/.mpc/{git-repo-name}/`, split it into MPC subtasks, write or append them to `~/.mpc/{git-repo-name}/mpc.md`, render the refreshed task tree, and then print the first executable wave plus matching worktree commands. 读取需求或计划文档，以 Git 仓库名解析共享控制目录 `~/.mpc/{工程项目名}/`，将其拆分为 MPC 子任务，写入或追加到 `~/.mpc/{工程项目名}/mpc.md`，先输出刷新后的任务树，再打印首轮可执行子任务及对应的 worktree 建议命令。"
