interface:
  display_name: "MPC Master Start"
  short_description: "Create MPC subtasks from a plan file / 从计划文件创建 MPC 子任务"
  default_prompt: "Read a requirement or plan document, resolve the current project's Git repository root, use `<repo-root>/.mpc/` as the controller directory, split the work into MPC subtasks, generate each subtask's `子任务目标`, write or append them to `<repo-root>/.mpc/mpc.md`, render the refreshed full task tree, and then print the first executable wave plus matching `/mpc-slave <task-name>` commands for separate conversations. 读取需求或计划文档，先解析当前项目的 Git 仓库根目录，并使用 `<repo-root>/.mpc/` 作为控制目录；将工作拆分为 MPC 子任务，为每个子任务生成 `子任务目标`，写入或追加到 `<repo-root>/.mpc/mpc.md`，先输出刷新后的完整任务树，再打印首轮可执行子任务及对应的 `/mpc-slave <任务标识>` 建议命令，并明确这些任务应在独立对话中推进。"
